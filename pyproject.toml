[project]
name = "reel-director"
version = "0.0.1"
description = "Pre-build a reel's edit from a script, record, auto-assemble."
readme = "README.md"
license = "MIT"
authors = [{name = "Anveshana Futurecorp Pvt Ltd (ANVE)"}]
requires-python = ">=3.11,<3.13"
dependencies = [
  "mlx-whisper",
  "silero-vad",
  "soundfile",
  "numpy<2",
]

[project.optional-dependencies]
dev = ["pytest", "playwright"]   # e2e drives installed Chrome (channel="chrome"); no `playwright install`
mac = ["pyobjc-framework-Vision>=12", "pyobjc-framework-Quartz>=12"]   # face track + person matte (Apple Vision)

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reel_director"]
